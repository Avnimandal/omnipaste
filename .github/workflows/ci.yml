name: CI & Code Integrity

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Validate JavaScript Syntax
      run: |
        node --check src/js/app.js
        node --check server.js

    - name: Verify Static File Structure
      run: |
        test -f index.html
        test -f src/css/style.css
        test -f src/js/app.js
        test -f docs/slides.md
        echo "All core assets and directories verified successfully."
